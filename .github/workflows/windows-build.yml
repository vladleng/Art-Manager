name: Windows App Build
run-name: Art Manager ${{ inputs.version || 'CI' }} - ${{ github.ref_name }} - ${{ inputs.mode || 'check' }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = scoped checks; candidate = full tests + ZIP; release = full tests + draft Release (main only)'
        type: choice
        options: [check, candidate, release]
        default: check
      version:
        description: 'For candidate/release: exact version from CMakeLists.txt (including suffix)'
        type: string
        default: ''

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.mode || 'check' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    name: Plan and validate CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      profile: ${{ steps.plan.outputs.profile }}
      package: ${{ steps.plan.outputs.package }}
      version: ${{ steps.plan.outputs.version }}
      tests: ${{ steps.plan.outputs.tests }}
      regex: ${{ steps.plan.outputs.regex }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate workflow syntax (pinned actionlint)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          cd "$RUNNER_TEMP/actionlint"
          gh release download v1.7.12 --repo rhysd/actionlint --pattern actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_1.7.12_linux_amd64.tar.gz' | sha256sum --check
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/actionlint/actionlint" -shellcheck= .github/workflows/*.yml
      - name: Policy regression tests
        run: python tools/ci/test_policy.py
      - name: Plan checks (unknown paths require full tests)
        id: plan
        env:
          CI_MODE: ${{ inputs.mode || 'check' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          base="$BASE_SHA"
          if [ -z "$base" ] || [ "$base" = '0000000000000000000000000000000000000000' ]; then
            base=$(git rev-parse HEAD^)
          fi
          git diff --check "$base" "$HEAD_SHA"
          python tools/ci/policy.py --base "$base" --head "$HEAD_SHA"

  windows:
    name: Windows tests and Desktop (${{ needs.prepare.outputs.version }}, ${{ needs.prepare.outputs.profile }})
    needs: prepare
    if: needs.prepare.outputs.profile != 'docs'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI_VERSION: ${{ needs.prepare.outputs.version }}
      CI_TESTS: ${{ needs.prepare.outputs.tests }}
      CI_REGEX: ${{ needs.prepare.outputs.regex }}
      CI_PACKAGE: ${{ needs.prepare.outputs.package }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Cache only dependency sources, never test results, binaries or build trees.
      - uses: actions/cache@v4
        with:
          path: .ci-deps/JUCE
          key: juce-source-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
      - name: Fetch pinned JUCE sources on cache miss
        run: |
          if (!(Test-Path .ci-deps/JUCE/CMakeLists.txt)) {
            $cmake = Get-Content CMakeLists.txt -Raw
            $tag = [regex]::Match($cmake, 'FetchContent_Declare\(JUCE .* GIT_TAG ([\w.-]+) GIT_SHALLOW TRUE\)').Groups[1].Value
            if (!$tag) { throw 'Cannot determine pinned JUCE version' }
            git clone --depth 1 --branch $tag https://github.com/juce-framework/JUCE.git .ci-deps/JUCE
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Configure and verify registered test inventory
        run: |
          cmake -S . -B build "-DFETCHCONTENT_SOURCE_DIR_JUCE=$pwd/.ci-deps/JUCE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/ci/policy.py --verify-ctest build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build selected tests
        run: |
          $targets = $env:CI_TESTS.Split(' ', [StringSplitOptions]::RemoveEmptyEntries)
          if (!$targets.Count) { throw 'Empty test selection' }
          cmake --build build --config Release --target $targets --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run selected tests once (including native UI evidence)
        run: ctest --test-dir build -C Release -R "$env:CI_REGEX" --output-on-failure --no-tests=error --timeout 120 --output-junit test-results.xml
      - name: Reject missing, skipped or disabled selected tests
        run: python tools/ci/policy.py --verify-report build/test-results.xml
      - name: Build Desktop only after tests pass
        run: cmake --build build --config Release --target ArrangerManagerDesktop --parallel 2
      - name: Package verified full-test candidate
        if: env.CI_PACKAGE == 'true'
        run: python tools/ci/package.py
      - name: Upload candidate
        if: env.CI_PACKAGE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Arranger-Manager-${{ env.CI_VERSION }}-Windows-App
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Preserve diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Arranger-Manager-${{ env.CI_VERSION }}-checks-${{ github.run_id }}
          path: |
            build/Testing/Temporary/LastTest.log
            build/test-results.xml
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/*.png
          if-no-files-found: warn
          retention-days: 7

  gate:
    name: CI Gate
    needs: [prepare, windows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require success, or an intentional docs-only Windows skip
        env:
          PLAN_RESULT: ${{ needs.prepare.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          PROFILE: ${{ needs.prepare.outputs.profile }}
        run: |
          test "$PLAN_RESULT" = success
          if [ "$PROFILE" = docs ]; then
            test "$WINDOWS_RESULT" = skipped
          else
            test "$WINDOWS_RESULT" = success
          fi

  release:
    name: Draft Release (${{ needs.prepare.outputs.version }})
    needs: [prepare, windows, gate]
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.mode == 'release' &&
      github.ref == 'refs/heads/main' && needs.prepare.outputs.profile == 'full' &&
      needs.prepare.outputs.package == 'true' && needs.windows.result == 'success' &&
      needs.gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Arranger-Manager-${{ env.VERSION }}-Windows-App
          path: dist
      - name: Verify exact-run package and create draft (never overwrite a release)
        run: |
          cd dist
          sha256sum --check *.sha256
          # Refuse an existing tag, whether or not a Release already exists.
          matches=$(gh api "repos/$GH_REPO/git/matching-refs/tags/v$VERSION" --jq 'length')
          if [ "$matches" != 0 ]; then
            echo 'Tag or version-prefixed tag already exists; refusing to replace an existing version.' >&2
            exit 1
          fi
          gh release create "v$VERSION" ./*.zip ./*.sha256 \
            --draft --target "$GITHUB_SHA" --title "Art Manager $VERSION" \
            --notes "Full Windows test gate passed for $GITHUB_SHA. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. User acceptance and publication remain manual."
