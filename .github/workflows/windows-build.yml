name: Windows App Build
run-name: Arranger Manager 0.2.6-Upd1 - ${{ github.ref_name }}
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Scoped cosmetic branch has its own Desktop-only build; other branches keep full CI.
    if: github.head_ref != 'ui-47-mr-uds'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate candidate version against the application and artifact
        shell: pwsh
        run: |
          $cmake = Get-Content 'CMakeLists.txt' -Raw
          if ($cmake -notmatch 'project\(ArrangerManager VERSION 0\.2\.6 LANGUAGES C CXX\)' -or
              $cmake -notmatch 'set\(ARRANGER_MANAGER_VERSION_SUFFIX "-Upd1"\)') {
            throw "CMake version differs from Actions run/artifact version 0.2.6-Upd1"
          }
          $application = Get-Content 'src/HubApplication.cpp' -Raw
          if ($application -notmatch 'return ARRANGER_MANAGER_VERSION;') {
            throw 'Desktop version must come from the CMake compile definition'
          }
      - name: Configure
        run: cmake -S . -B build
      - name: Build tests
        run: cmake --build build --config Release --target WorkspaceTemplateTests ArrangementTagTests SongSnapshotTests SongCatalogTests WorkspaceTests WorkspaceNavigationTests BlockEditorTests GeneralTaskTests TaskDomainTests TaskTreeUiTests WorkspaceTaskViewsTests --parallel 2
      - name: Test reader, catalog, workspace and tasks
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Capture task table preview
        shell: pwsh
        run: |
          $env:ARRANGER_UI_PREVIEW = "1"
          ./build/TaskTreeUiTests_artefacts/Release/TaskTreeUiTests.exe
      - name: Build standalone desktop (Studio Pro plug-ins retired)
        run: cmake --build build --config Release --target ArrangerManagerDesktop --parallel 2
      - name: Prepare package and version manifest
        shell: pwsh
        run: |
          $cmake = Get-Content 'CMakeLists.txt' -Raw
          $baseVersion = [regex]::Match($cmake, 'project\(ArrangerManager VERSION (\d+\.\d+\.\d+)').Groups[1].Value
          $suffix = [regex]::Match($cmake, 'set\(ARRANGER_MANAGER_VERSION_SUFFIX "([^"]+)"\)').Groups[1].Value
          $version = "$baseVersion$suffix"
          if ($version -ne '0.2.6-Upd1') { throw "Version mismatch: $version" }
          $packageDir = "package/Arranger Manager $version"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item -Force "build/ArrangerManagerDesktop_artefacts/Release/Arranger Manager.exe" $packageDir
          # Preview is optional; the native UI snapshot test may write to its runner working directory.
          $preview = Get-ChildItem -Path '.' -Filter 'task-table-compact.png' -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -ne $preview) {
            Copy-Item -Force $preview.FullName $packageDir
          } else {
            Write-Host 'Optional preview was not found; Desktop package remains valid.'
          }
          # Resolve preview sources before writing to the package; never enumerate
          # the destination while copying (Copy-Item cannot copy a file to itself).
          foreach ($name in @('template-editor.png', 'template-create.png', 'task-properties.png', 'subtask-properties.png')) {
            $source = Get-Item -LiteralPath $name -ErrorAction SilentlyContinue
            if ($null -eq $source) { $source = Get-Item -LiteralPath "build/$name" -ErrorAction SilentlyContinue }
            if ($null -ne $source) { Copy-Item -LiteralPath $source.FullName -Destination $packageDir -Force }
          }
          Copy-Item -Force "docs/TEMPLATES-67.md" $packageDir
          Copy-Item -Force "docs/LEGACY-RETIREMENT-7.md" $packageDir
          Copy-Item -Force "docs/WORKSPACE-0.1e-DECISIONS.md" $packageDir
          [ordered]@{
            component = "Arranger Manager"
            version = $version
            commit = "${{ github.sha }}"
            issue = 67
          } | ConvertTo-Json | Set-Content -Encoding utf8 "$packageDir/version.json"
      - uses: actions/upload-artifact@v4
        with:
          name: Arranger-Manager-0.2.6-Upd1-Windows-App
          path: package

